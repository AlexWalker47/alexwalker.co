<!-- Shared look for the Glass Stats text pages (/glass-stats/, /privacy/, /support/): one readable
     column. display:block overrides the site's two-column section grid, which would otherwise
     flow each paragraph into alternating columns. -->
<style>
    body.cinematic section.glass-stats-doc .container {
        display: block; max-width: 720px; width: 100%; box-sizing: border-box;
        padding-left: 24px; padding-right: 24px;
        overflow-wrap: break-word;
    }
    body.cinematic section.glass-stats-doc h2 { text-align: center; margin-bottom: 24px; }
    body.cinematic section.glass-stats-doc h3 { text-align: left; padding: 0; margin: 32px 0 12px; }
    body.cinematic section.glass-stats-doc ul { padding-left: 20px; margin-bottom: 12px; }
    body.cinematic section.glass-stats-doc li { margin-bottom: 6px; }
    body.cinematic section.glass-stats-doc .glass-stats-meta { text-align: center; opacity: 0.7; }
    body.cinematic section.glass-stats-doc .glass-stats-links { text-align: center; }
</style>
<style>
    body.cinematic section.glass-stats-doc strong { font-weight: 600; color: #fff; }
    body.cinematic section.glass-stats-doc .glass-stats-legal { text-align: center; font-size: 12px; opacity: 0.5; margin-top: 40px; }
</style>
